<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sTRX Top5 查询</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/common.js"></script>
  <style>
    body{font-family:ui-sans-serif,system-ui,Segoe UI,Arial;margin:24px}
    input{margin:0 8px 0 4px}
    table{border-collapse:collapse;margin-top:12px;width:100%}
    th,td{border:1px solid #ccc;padding:6px}
    pre{background:#f6f8fa;padding:12px;overflow:auto}
    @media (max-width:640px){body{margin:16px}}
  </style>
</head>
<body>
  <h2>sTRX Deposit/Withdraw Top 5（指定日 00:00 UTC 之前）</h2>
  <form id="q">
    <label>date:
      <input id="date" placeholder="2025-11-08" required />
    </label>
    <label>lookbackHours:
      <input id="lookback" type="number" min="1" max="168" value="48" />
    </label>
    <button type="submit">查询</button>
  </form>
  <div id="msg"></div>
  <div class="ui-scroll">
    <table id="tbl" style="display:none">
      <thead><tr><th>time(UTC)</th><th>type</th><th>txid</th><th>TRX</th><th>sTRX</th><th>ratio</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <pre id="raw" style="display:none"></pre>

<script>
const f = document.getElementById('q');
const msg = document.getElementById('msg');
const tbl = document.getElementById('tbl');
const tbody = tbl.querySelector('tbody');
const raw = document.getElementById('raw');
const esc = UI.escapeHtml;

f.addEventListener('submit', e=>{
  e.preventDefault();

  const date = document.getElementById('date').value.trim();
  const lookback = document.getElementById('lookback').value.trim();
  const hideResult = () => { tbl.style.display='none'; raw.style.display='none'; tbody.innerHTML=''; };

  UI.run({ buttons: f.querySelector('button'), status: msg, onError: hideResult }, async () => {
    const j = await UI.requestJson(`/api/top5?date=${encodeURIComponent(date)}&lookback=${encodeURIComponent(lookback)}`);

    tbody.innerHTML = j.data.map(row=>`<tr><td>${esc(row.time_utc)}</td><td>${esc(row.type)}</td>
                    <td><a href="https://tronscan.org/#/transaction/${esc(row.txid)}" target="_blank" rel="noreferrer">${esc(row.txid.slice(0,12))}…</a></td>
                    <td>${esc(row.TRX)}</td><td>${esc(row.sTRX)}</td><td>${esc(row.ratio)}</td></tr>`).join('');
    tbl.style.display='table';
    raw.textContent = JSON.stringify(j, null, 2);
    raw.style.display='block';
    UI.setStatus(msg, j.count ? 'success' : 'empty', `date=${j.date}, lookback=${j.lookback}h, count=${j.count}`);
  });
});
</script>
</body>
</html>
