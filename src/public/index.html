<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRON Dashboards</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/common.js"></script>
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">TRON Dashboards</h1>
      <p class="page-sub">Internal monitoring of TRON wallets, Super Representatives, sTRX and treasury snapshots.</p>
    </div>
  </header>

  <div id="directory"></div>
</main>

<script>
// One card per dashboard, grouped like the navigation bar (links come from UI.NAV).
const DESCRIPTIONS = {
  "sr.html": "Votes, vote share, brokerage and claimable TRX rewards by Super Representative.",
  "sr.html#he": "HE votes per candidate and their share of each candidate's total votes.",
  "troninc-revenue.html": "Available and staked TRX, sTRX, rewards, energy and bandwidth of the revenue wallet.",
  "tron-matrix.html": "Account status, TRX balances, staking, SR rank and votes of the Tron Matrix wallet.",
  "query.html": "The last five sTRX deposits or withdrawals before 00:00 UTC on a chosen date.",
  "query.html#sql": "Hourly wallet valuations: read-only SQL queries and CSV export.",
  "mstr-sharplink-view.html": "Hourly MSTR and SBET prices, BTC / ETH holdings and mNAV.",
  "cmc-usdt.html": "Daily USDT circulating and total supply from CoinMarketCap.",
};

document.getElementById("directory").innerHTML = UI.NAV.map(
  (group) =>
    '<section class="card">' +
    `<h2 class="card-title" style="margin-bottom: 12px;">${UI.escapeHtml(group.group)}</h2>` +
    '<div class="directory">' +
    group.items
      .map(
        (item) =>
          `<a href="${UI.escapeHtml(UI.navHref(item))}">` +
          `<strong>${UI.escapeHtml(item.label)}</strong>` +
          `<span>${UI.escapeHtml(DESCRIPTIONS[item.path] || "")}</span></a>`
      )
      .join("") +
    "</div></section>"
).join("");
</script>
</body>
</html>
