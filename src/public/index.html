<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sTRX Top5 查询</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/common.js"></script>
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1 class="page-title">sTRX Deposit/Withdraw Top 5（指定日 00:00 UTC 之前）</h1>
  </header>

  <section class="card">
    <form id="q" class="toolbar">
      <label class="field">date:
        <input id="date" placeholder="2025-11-08" required />
      </label>
      <label class="field">lookbackHours:
        <input id="lookback" type="number" min="1" max="168" value="48" />
      </label>
      <button type="submit" class="primary">查询</button>
    </form>

    <div id="msg" style="margin-top: 14px;"></div>

    <div id="tbl-wrap" class="table-wrap" style="display:none">
      <table id="tbl">
        <thead><tr><th>time(UTC)</th><th>type</th><th>txid</th><th class="num">TRX</th><th class="num">sTRX</th><th class="num">ratio</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <details id="raw-box" class="collapsible" style="display:none; margin-top: 14px;">
      <summary>Raw JSON</summary>
      <pre id="raw" class="json"></pre>
    </details>
  </section>
</div>

<script>
const f = document.getElementById('q');
const msg = document.getElementById('msg');
const tblWrap = document.getElementById('tbl-wrap');
const tbody = document.querySelector('#tbl tbody');
const rawBox = document.getElementById('raw-box');
const raw = document.getElementById('raw');
const esc = UI.escapeHtml;

f.addEventListener('submit', e=>{
  e.preventDefault();

  const date = document.getElementById('date').value.trim();
  const lookback = document.getElementById('lookback').value.trim();
  const hideResult = () => { tblWrap.style.display='none'; rawBox.style.display='none'; tbody.innerHTML=''; };

  UI.run({ buttons: f.querySelector('button'), status: msg, onError: hideResult }, async () => {
    const j = await UI.requestJson(`/api/top5?date=${encodeURIComponent(date)}&lookback=${encodeURIComponent(lookback)}`);

    tbody.innerHTML = j.data.map(row=>`<tr><td>${esc(row.time_utc)}</td><td>${esc(row.type)}</td>
                    <td><a class="mono" href="https://tronscan.org/#/transaction/${esc(row.txid)}" title="${esc(row.txid)}" target="_blank" rel="noreferrer">${esc(row.txid.slice(0,12))}…</a></td>
                    ${UI.td('TRX', row.TRX)}${UI.td('sTRX', row.sTRX)}${UI.td('ratio', row.ratio)}</tr>`).join('');
    tblWrap.style.display='block';
    raw.textContent = JSON.stringify(j, null, 2);
    rawBox.style.display='block';
    UI.setStatus(msg, j.count ? 'success' : 'empty', `date=${j.date}, lookback=${j.lookback}h, count=${j.count}`);
  });
});
</script>
</body>
</html>
