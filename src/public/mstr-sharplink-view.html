<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSTR & Sharplink Snapshots Viewer</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/common.css" />
  <script src="assets/common.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      padding: 24px;
      background: #f5f5f7;
      color: #111827;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      text-align: center;
    }

    .controls {
      margin-bottom: 16px;
      text-align: center;
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: white;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
    }

    button:hover {
      background: #f3f4f6;
    }

    .status {
      margin-left: 4px;
      font-size: 13px;
      color: #6b7280;
    }

    .section {
      margin-top: 24px;
      margin-bottom: 24px;
      background: white;
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 18px;
      text-align: center;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 6px 8px;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
      width: 220px;
    }

    .empty {
      font-size: 13px;
      color: #9ca3af;
      font-style: italic;
    }

    .json-block {
      margin-top: 10px;
      background: #111827;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      max-height: 260px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      resize: vertical;
      box-sizing: border-box;
    }

    .query-block {
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .query-actions {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .query-actions .status {
      margin-left: 8px;
    }

    .row-title {
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    .history-table th,
    .history-table td {
      width: auto;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body {
        margin: 0;
        padding: 16px;
      }

      .section {
        padding: 12px 14px;
      }

      th {
        width: 40%;
      }
    }
  </style>
</head>
<body>
  <h1>MSTR & Sharplink Snapshots</h1>

  <div class="controls">
    <button id="refresh-btn">Refresh (insert + fetch)</button>
    <span class="status" id="status-text">Idle</span>
  </div>

  <div class="section">
    <h2>MSTR Snapshot (Latest)</h2>
    <div id="mstr-table"></div>
  </div>

  <div class="section">
    <h2>Sharplink Snapshot (Latest)</h2>
    <div id="sharplink-table"></div>
  </div>

  <!-- ======== 历史查询（SQL） ======== -->
  <div class="section">
    <div class="query-block">
      <h2>MSTR Snapshots (Historical)</h2>
      <textarea id="mstr-sql"></textarea>
      <div class="query-actions">
        <button id="run-mstr-sql-btn">Run</button>
        <span class="status" id="mstr-sql-status"></span>
      </div>
      <div id="mstr-sql-result"></div>
    </div>

    <div class="query-block">
      <h2>Sharplink Snapshots (Historical)</h2>
      <textarea id="sharplink-sql"></textarea>
      <div class="query-actions">
        <button id="run-sharplink-sql-btn">Run</button>
        <span class="status" id="sharplink-sql-status"></span>
      </div>
      <div id="sharplink-sql-result"></div>
    </div>
  </div>

  <div class="section">
    <h2>Raw JSON (Debug)</h2>
    <pre class="json-block" id="json-raw">{}</pre>
  </div>

  <script>
    // ============ 通用格式化函数 ============
    const fmtUSD2 = (v) =>
      v == null
        ? ""
        : "$" +
          Number(v).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });

    const fmtUSD0 = (v) =>
      v == null ? "" : "$" + Math.round(Number(v)).toLocaleString("en-US");

    const fmtUSD_M = (v) =>
      v == null ? "" : "$" + Number(v).toLocaleString("en-US");

    const fmtBTC = (v) =>
      v == null ? "" : "₿" + Number(v).toLocaleString("en-US");

    const fmtMnav = (v) =>
      v == null ? "" : Number(v).toFixed(2);

    const fmtMnavWithX = (v) =>
      v == null ? "" : Number(v).toFixed(2) + "x";

    const fmtNumber0 = (v) =>
      v == null ? "" : Number(v).toLocaleString("en-US");

    const fmtUsdBillion = (v) => {
      if (v == null) return "";
      const b = Number(v) / 1e9;
      return "$" + b.toFixed(2) + "B";
    };

    // 把 UTC ISO 字符串转换成 HKT 显示
    function formatHktFromUtc(utcStr) {
      if (!utcStr) return "";
      const d = new Date(utcStr);
      if (isNaN(d.getTime())) return "";
      const hkt = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      const y = hkt.getUTCFullYear();
      const m = pad(hkt.getUTCMonth() + 1);
      const day = pad(hkt.getUTCDate());
      const hh = pad(hkt.getUTCHours());
      const mm = pad(hkt.getUTCMinutes());
      const ss = pad(hkt.getUTCSeconds());
      return `${y}-${m}-${day} ${hh}:${mm}:${ss}`;
    }

    // ============ MSTR 字段配置（latest & historical 共用） ============
    const MSTR_FIELDS = [
      { key: "id", label: "ID", fmt: (v) => v },
      { key: "timestamp_utc", label: "Timestamp (UTC)", fmt: (v) => v },
      { key: "mstr_price", label: "MSTR Price", fmt: fmtUSD2 },
      { key: "market_cap_million", label: "Market Cap ($M)", fmt: fmtUSD_M },
      {
        key: "enterprise_value_million",
        label: "Enterprise Value ($M)",
        fmt: fmtUSD_M,
      },
      { key: "debt_million", label: "Debt ($M)", fmt: fmtUSD_M },
      { key: "pref_million", label: "Preferred ($M)", fmt: fmtUSD_M },
      { key: "btc_price", label: "BTC Price", fmt: fmtUSD2 },
      { key: "btc_holdings", label: "BTC Holdings", fmt: fmtBTC },
      { key: "btc_nav_million", label: "BTC NAV ($M)", fmt: fmtUSD_M },
      {
        key: "btc_nav_number_million",
        label: "BTC NAV Number ($M)",
        fmt: fmtUSD_M,
      },
      { key: "mnav", label: "mNAV", fmt: fmtMnav },
    ];

    // ============ Sharplink 字段配置 ============
    const SHARPLINK_FIELDS = [
      { key: "id", label: "ID", fmt: (v) => v },
      { key: "timestamp_utc", label: "Timestamp (UTC)", fmt: (v) => v },
      { key: "sharplink_last_price", label: "SBET Price", fmt: fmtUSD2 },
      { key: "eth_last_price", label: "ETH Price", fmt: fmtUSD0 },
      {
        key: "impact3_market_cap",
        label: "Market Cap",
        fmt: fmtUSD0,
      },
      {
        key: "impact3_total_eth_holdings",
        label: "Total ETH Holdings",
        fmt: fmtNumber0,
      },
      {
        key: "impact3_eth_nav",
        label: "ETH NAV",
        fmt: fmtUsdBillion,
      },
      {
        key: "impact3_basic_mnav",
        label: "Basic mNAV",
        fmt: fmtMnavWithX,
      },
      {
        key: "impact3_fully_diluted_mnav",
        label: "Fully Diluted mNAV",
        fmt: fmtMnavWithX,
      },
      {
        key: "impact3_enterprise_value",
        label: "Enterprise Value",
        fmt: fmtUSD0,
      },
    ];

    // ============ 页面元素 ============
    const refreshBtn = document.getElementById("refresh-btn");
    const statusEl = document.getElementById("status-text");
    const mstrEl = document.getElementById("mstr-table");
    const sharplinkEl = document.getElementById("sharplink-table");
    const jsonRawEl = document.getElementById("json-raw");
    const escapeHtml = UI.escapeHtml;

    // ============ 字段表（latest & historical 共用） ============
    function renderFieldTable(fields, row) {
      let html =
        "<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>";
      for (const field of fields) {
        html +=
          "<tr><th>" +
          escapeHtml(field.label) +
          "</th><td>" +
          escapeHtml(field.fmt(row[field.key])) +
          "</td></tr>";
      }
      html += "</tbody></table>";
      return html;
    }

    // ============ 最新 snapshot 加载 ============

    function renderLatest(container, fields, obj, emptyText) {
      container.innerHTML = obj
        ? renderFieldTable(fields, obj)
        : '<div class="empty">' + emptyText + "</div>";
    }

    function showLatest(data) {
      jsonRawEl.textContent = JSON.stringify(data, null, 2);
      renderLatest(mstrEl, MSTR_FIELDS, data.mstr, "No MSTR snapshot found");
      renderLatest(
        sharplinkEl,
        SHARPLINK_FIELDS,
        data.sharplink,
        "No Sharplink snapshot found"
      );
    }

    function loadLatestOnly() {
      return UI.run(
        {
          buttons: refreshBtn,
          status: statusEl,
          loading: "Loading latest from DB...",
          onError: (err) => {
            jsonRawEl.textContent =
              "Error while calling /api/mstr-sharplink/latest:\n" + err.message;
          },
        },
        async () => {
          const data = await UI.requestJson("/api/mstr-sharplink/latest");
          showLatest(data);
          UI.setStatus(statusEl, "success", "Loaded latest at " + UI.timeNow());
        }
      );
    }

    // Refresh 会抓取数据并写入新 snapshot：请求期间按钮禁用，失败时保留页面上已有的数据
    function refreshAndInsert() {
      return UI.run(
        {
          buttons: refreshBtn,
          status: statusEl,
          loading: "Refreshing: fetching sources and inserting a new snapshot...",
          onError: (err) => {
            UI.setStatus(
              statusEl,
              "error",
              "Refresh failed: " + err.message + ". The data below has not been updated."
            );
            jsonRawEl.textContent =
              "Error while calling /api/mstr-sharplink/refresh:\n" + err.message;
          },
        },
        async () => {
          const data = await UI.requestJson("/api/mstr-sharplink/refresh", {
            method: "POST",
          });
          showLatest(data);

          const idInfo = data.inserted
            ? ` (MSTR id ${data.inserted.mstrId}, SBET id ${data.inserted.sharplinkId})`
            : "";

          UI.setStatus(statusEl, "success", "Refreshed at " + UI.timeNow() + idInfo);
        }
      );
    }

    // ============ 历史查询：默认 SQL ============

    function getTodayHkt0730WindowUtcIso() {
      // 现在时间（UTC）
      const now = new Date();
      const utcMs = now.getTime();

      // 转成 HKT（UTC+8）来取“今天”的日期
      const hktMs = utcMs + 8 * 60 * 60 * 1000;
      const hktNow = new Date(hktMs);

      const y = hktNow.getUTCFullYear();
      const m = hktNow.getUTCMonth(); // 0-based
      const d = hktNow.getUTCDate();

      // HKT 07:30 => UTC  -1:30
      const startUtc = new Date(Date.UTC(y, m, d, -1, 30, 0));
      // HKT 08:00 => UTC  0:00
      const endUtc = new Date(Date.UTC(y, m, d, 0, 0, 0));

      return {
        startIso: startUtc.toISOString(),
        endIso: endUtc.toISOString(),
      };
    }

    function initDefaultSqlForQueries() {
      const mstrSql = document.getElementById("mstr-sql");
      const sharplinkSql = document.getElementById("sharplink-sql");

      const { startIso, endIso } = getTodayHkt0730WindowUtcIso();

      const whereBlock =
        `WHERE timestamp_utc >= '${startIso}'\n` +
        `  AND timestamp_utc < '${endIso}'`;

      mstrSql.value =
        `SELECT *\n` +
        `FROM mstr_snapshots\n` +
        `${whereBlock}\n` +
        `ORDER BY timestamp_utc ASC\n` +
        `LIMIT 1;`;

      sharplinkSql.value =
        `SELECT *\n` +
        `FROM sharplink_snapshots\n` +
        `${whereBlock}\n` +
        `ORDER BY timestamp_utc ASC\n` +
        `LIMIT 1;`;
    }

    // ============ 历史查询：运行 SQL ============

    function runSqlQuery(sql, targetEl, sqlStatusEl, button, fields, name) {
      if (!sql.trim()) {
        UI.setStatus(sqlStatusEl, "error", "Please enter a SQL query.");
        targetEl.innerHTML = "";
        return;
      }

      return UI.run(
        {
          buttons: button,
          status: sqlStatusEl,
          loading: "Running...",
          onError: (err) => {
            targetEl.innerHTML =
              '<div class="empty">Query failed: ' + escapeHtml(err.message) + "</div>";
          },
        },
        async () => {
          const data = await UI.runSql(sql);
          UI.setStatus(
            sqlStatusEl,
            data.rows.length ? "success" : "empty",
            UI.rowsSummary(data.rows.length)
          );
          renderHistory(targetEl, data.rows, data.fields, fields, name);
        }
      );
    }

    // 一行：标题 + 字段表；多行：每个 snapshot 一行的横向表格
    function renderHistory(container, rows, resultFields, fields, name) {
      if (rows.length === 0) {
        container.innerHTML = '<div class="empty">No result found</div>';
        return;
      }

      // 只显示查询返回了的已知字段；一个都没有时（自定义 SQL），直接显示查询返回的列
      fields = fields.filter((f) => resultFields.includes(f.key));
      if (fields.length === 0) {
        fields = resultFields.map((key) => ({ key, label: key, fmt: UI.formatCell }));
      }

      if (rows.length === 1) {
        const row = rows[0];
        const ts = row.timestamp_utc || "N/A";
        const hktStr = formatHktFromUtc(ts);
        const title =
          hktStr && hktStr.length > 0
            ? `${name} snapshot – ${ts} (HKT ${hktStr})`
            : `${name} snapshot – ${ts}`;

        container.innerHTML =
          `<h2 style="text-align:center;margin-top:8px;margin-bottom:12px;">${escapeHtml(
            title
          )}</h2>` + renderFieldTable(fields, row);
        return;
      }

      const head = fields
        .map((f) => "<th>" + escapeHtml(f.label) + "</th>")
        .join("");
      const body = rows
        .map(
          (row) =>
            "<tr>" +
            fields.map((f) => "<td>" + escapeHtml(f.fmt(row[f.key])) + "</td>").join("") +
            "</tr>"
        )
        .join("");

      container.innerHTML =
        '<div class="ui-scroll"><table class="history-table"><thead><tr>' +
        head +
        "</tr></thead><tbody>" +
        body +
        "</tbody></table></div>";
    }

    // ============ 事件绑定 & 初始化 ============
    refreshBtn.addEventListener("click", refreshAndInsert);

    const mstrRunBtn = document.getElementById("run-mstr-sql-btn");
    mstrRunBtn.addEventListener("click", () => {
      runSqlQuery(
        document.getElementById("mstr-sql").value,
        document.getElementById("mstr-sql-result"),
        document.getElementById("mstr-sql-status"),
        mstrRunBtn,
        MSTR_FIELDS,
        "MSTR"
      );
    });

    const sharplinkRunBtn = document.getElementById("run-sharplink-sql-btn");
    sharplinkRunBtn.addEventListener("click", () => {
      runSqlQuery(
        document.getElementById("sharplink-sql").value,
        document.getElementById("sharplink-sql-result"),
        document.getElementById("sharplink-sql-status"),
        sharplinkRunBtn,
        SHARPLINK_FIELDS,
        "Sharplink"
      );
    });

    initDefaultSqlForQueries();
    loadLatestOnly();
  </script>
</body>
</html>
