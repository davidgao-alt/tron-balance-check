<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USDT Supply · TRON Dashboards</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/common.css">
  <script src="assets/common.js"></script>
  <style>
    details { margin-top: 14px; }
    @media (max-width: 600px) {
      .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters .field { flex-direction: column; align-items: stretch; gap: 4px; }
      .filters input { min-width: 0; width: 100%; }
      .filters .spacer { display: none; }
    }
  </style>
</head>
<body>
<main class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">USDT Supply</h1>
      <p class="page-sub">Daily circulating and total supply snapshots from CoinMarketCap.</p>
    </div>
  </header>

  <section class="card" aria-labelledby="latest-title">
    <div class="card-head">
      <div>
        <h2 class="card-title" id="latest-title">Latest snapshot</h2>
        <p id="latest-status" class="muted" role="status"></p>
      </div>
      <div class="card-actions">
        <span id="latest-fresh" hidden></span>
        <button id="refresh">Refresh</button>
      </div>
    </div>
    <div class="kpi-grid" id="supply" hidden></div>
  </section>

  <section class="card" aria-labelledby="history-title" id="history">
    <div class="card-head"><h2 class="card-title" id="history-title">Snapshot history</h2></div>
    <form class="toolbar filters" id="filters">
      <label class="field">From (UTC)<input type="date" id="from"></label>
      <label class="field">To (UTC)<input type="date" id="to"></label>
      <button class="primary" type="submit">Load</button>
      <span class="spacer"></span><button type="button" id="csv">Download CSV</button>
    </form>
    <details class="collapsible" data-remember="supply-sql">
      <summary>Custom SQL</summary>
      <p class="muted">Queries run on the wallet service that stores the daily USDT snapshots.</p>
      <textarea id="query" aria-label="Custom SQL" spellcheck="false" rows="9"></textarea>
      <button class="primary" id="run">Run query</button>
    </details>
  </section>

  <section class="card" aria-labelledby="results-title">
    <div class="card-head">
      <h2 class="card-title" id="results-title">Query results</h2>
      <div id="query-status" role="status"></div>
    </div>
    <div class="table-wrap" id="results"></div>
  </section>
</main>
<script>
// The CMC collector writes to the database served by the English wallet query API.
const apiOrigin = "https://troninc-wallet-event-query.onrender.com";
const $ = id => document.getElementById(id);

function supplySql(from, to, limit) {
  const lines = [
    "SELECT id, inserted_at AS snapshot_utc, last_updated AS cmc_updated_utc,",
    "       circulating_supply, total_supply",
    "FROM public.cmc_usdt_supply_snapshots",
    "WHERE cmc_id = 825"
  ];
  if (from) lines.push(`  AND inserted_at >= TIMESTAMPTZ '${from} 00:00:00+00'`);
  if (to) lines.push(`  AND inserted_at < TIMESTAMPTZ '${to} 00:00:00+00' + INTERVAL '24 hours'`);
  return [...lines, "ORDER BY inserted_at DESC NULLS LAST, id DESC", `LIMIT ${limit}`].join("\n");
}

function latest() {
  const status = $("latest-status");
  const hide = () => { $("supply").hidden = true; $("latest-fresh").hidden = true; };
  return UI.run({ status, buttons: $("refresh"), onError: hide }, async () => {
    const { rows } = await UI.runSql(supplySql("", "", 1), apiOrigin);
    const row = rows[0];
    if (!row) {
      hide();
      return UI.setStatus(status, "empty", "No USDT snapshots yet.");
    }
    const amount = (v) => (v == null ? "—" : UI.formatNumber(String(v)));
    $("supply").innerHTML =
      UI.kpi("Circulating supply", amount(row.circulating_supply), "", "USDT") +
      UI.kpi("Total supply", amount(row.total_supply), "", "USDT");
    $("supply").hidden = false;
    const captured = UI.formatHktUtc(row.snapshot_utc);
    UI.setStatus(status, "", captured ? `Captured ${captured}` : `Snapshot #${row.id}`);
    // One snapshot a day.
    UI.setFreshness($("latest-fresh"), row.snapshot_utc, 26);
  });
}

const query = $("query");
const status = $("query-status");
let generatedSql = supplySql("", "", 50);
query.value = generatedSql;

function panel() {
  return { apiOrigin, sql: query.value, status, container: $("results"), buttons: $("history").querySelectorAll("button") };
}

$("filters").onsubmit = event => {
  event.preventDefault();
  const from = $("from").value;
  const to = $("to").value;
  if (from && to && from > to) return UI.setStatus(status, "error", "From must be on or before To.");
  if (query.value !== generatedSql && !confirm("Replace your edited SQL with the date-filtered query?")) return;
  generatedSql = supplySql(from, to, from || to ? 200 : 50);
  query.value = generatedSql;
  UI.runSqlInto(panel());
};
$("run").onclick = () => UI.runSqlInto(panel());
$("csv").onclick = () => UI.downloadCsv(panel());
$("refresh").onclick = latest;

latest();
UI.runSqlInto(panel());
</script>
</body>
</html>
