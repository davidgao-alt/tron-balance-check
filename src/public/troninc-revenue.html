<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Wallet · TRON Dashboards</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/common.css">
<script src="assets/common.js"></script>
<script defer src="assets/sql-schema.js"></script>
</head>
<body>

<main class="page">

<header class="page-header">
  <div>
    <h1 class="page-title">Tron Inc. Revenue Wallet</h1>
    <p class="page-sub">
      <span class="mono copyable" title="Click to copy">TEb4gXicQ39VWN3jbeXygEJJV1McRWg4uZ</span>
      · <a href="https://tronscan.org/#/address/TEb4gXicQ39VWN3jbeXygEJJV1McRWg4uZ" target="_blank" rel="noreferrer">Tronscan</a>
    </p>
  </div>
</header>


<!-- =====================================================
     LATEST SNAPSHOT
     ===================================================== -->

<section class="card" id="latest-card">

<div class="card-head">
  <div>
    <h2 class="card-title">Latest snapshot</h2>
    <p class="muted" id="latest-time"></p>
  </div>
  <div class="card-actions">
    <span id="latest-fresh" hidden></span>
    <button type="button" onclick="loadLatest()">Refresh</button>
  </div>
</div>

<div id="latest-status"></div>

<div class="kpi-grid" id="kpis"></div>

</section>


<section class="card" id="assets-card">
  <div class="card-head">
    <div>
      <h2 class="card-title">Assets</h2>
      <p class="muted">Tronscan assets list at the latest snapshot (staked TRX is counted in Total TRX above).</p>
    </div>
    <div id="assets-status"></div>
  </div>
  <div class="table-wrap" id="assets-result"></div>
</section>


<!-- =====================================================
     HISTORY
     ===================================================== -->

<div id="history-tab">

<section class="card">

<div class="card-head"><h2 class="card-title">Snapshot history</h2></div>

<div class="toolbar">
  <label class="field">From (HKT) <input type="date" id="history-from"></label>
  <label class="field">To (HKT) <input type="date" id="history-to"></label>
  <button class="primary" onclick="loadHistory()">Load</button>
  <span class="spacer"></span>
  <button onclick="UI.downloadCsv(panel())">Download CSV</button>
</div>

<details class="collapsible" data-remember="history-sql" style="margin-top: 14px;">
<summary>Custom SQL</summary>

<textarea id="history-sql" aria-label="Custom SQL" spellcheck="false" data-schema-tables="troninc_revenue_snapshots"></textarea>

<button class="primary" onclick="runHistory()">Run</button>

</details>

</section>


<section class="card">

<div class="card-head">
  <h2 class="card-title">Query results</h2>
  <div id="history-status"></div>
</div>

<div class="table-wrap" id="history-result"></div>

</section>

</div>

</main>

<script>

const TABLE = "troninc_revenue_snapshots";

const $ = (id) => document.getElementById(id);

const LATEST = `(SELECT * FROM ${TABLE} ORDER BY snapshot_time_utc DESC LIMIT 1) s`;


/* ======================================================
   NUMBER FORMATTING (cards)
   ====================================================== */

// Cuts a decimal string to at most `digits` decimals (no rounding), then adds separators.
function amount(value, digits = 6) {
  if (value === null || value === undefined || value === "") return "–";
  const [whole, fraction = ""] = String(value).split(".");
  return UI.formatNumber(fraction ? `${whole}.${fraction.slice(0, digits)}` : whole);
}

function usd(value) {
  if (value === null || value === undefined) return "–";
  return "$" + Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}


/* ======================================================
   LATEST SNAPSHOT: cards, assets, votes
   ====================================================== */

const kpi = UI.kpi;

function renderKpis(r) {
  $("latest-time").textContent = `Snapshot ${UI.formatHktUtc(r.snapshot_time_utc)} · id ${r.id}`;
  // Snapshots run every two hours.
  UI.setFreshness($("latest-fresh"), r.snapshot_time_utc, 3);

  $("kpis").innerHTML = [
    kpi("TRX available", amount(r.trx_available), "", "TRX"),
    kpi("TRX staked", amount(r.trx_staked),
      `Energy ${amount(r.trx_staked_energy)} · Bandwidth ${amount(r.trx_staked_bandwidth)}` +
      (Number(r.trx_delegated_out) ? ` · delegated out ${amount(r.trx_delegated_out)}` : ""), "TRX"),
    kpi("TRX unstaking", amount(r.trx_unstaking), `Withdrawable ${amount(r.trx_withdrawable)}`, "TRX"),
    kpi("Total TRX", amount(r.trx_total), "Available + staked + unstaking", "TRX"),
    kpi("Claimable voter/SR rewards", amount(r.claimable_reward_trx), "", "TRX"),
    kpi("sTRX", amount(r.strx_balance)),
    kpi("Votes", amount(r.votes_used), `TRON Power ${amount(r.vote_power)}`),
    kpi("Energy", amount(r.energy_available), `available of ${amount(r.energy_limit)}`),
    kpi("Bandwidth", amount(r.bandwidth_available), `available of ${amount(r.bandwidth_limit)}`),
    kpi("Total assets (USD)", usd(r.total_assets_usd),
      r.trx_price_usd === null ? "Tronscan prices unavailable" : `TRX $${Number(r.trx_price_usd).toFixed(4)}`),
  ].join("");
}

const ASSETS_SQL = `SELECT
  a->>'token_abbr' AS token,
  a->>'token_name' AS token_name,
  CASE a->>'token_type' WHEN '0' THEN 'TRX' WHEN '10' THEN 'TRC10' WHEN '20' THEN 'TRC20' ELSE a->>'token_type' END AS type,
  a->>'token_id' AS token_id,
  a->>'balance' AS balance,
  a->>'price_usd' AS price_usd,
  a->>'value_usd' AS value_usd
FROM ${LATEST}, jsonb_array_elements(s.assets) a
ORDER BY (a->>'value_usd')::numeric DESC NULLS LAST`;

// Runs a fixed query into a card; `emptyText` replaces "No results".
function loadList(name, sql, emptyText) {
  const status = $(`${name}-status`);
  return UI.runSqlInto({
    sql,
    container: $(`${name}-result`),
    status,
    buttons: [],
    onResult: (data) => {
      if (!data.rows.length) UI.setStatus(status, "empty", emptyText);
    }
  });
}

async function loadLatest() {
  const status = $("latest-status");
  const button = document.querySelector("#latest-card .card-actions button");

  await UI.run({ buttons: button, status }, async () => {
    const data = await UI.runSql(
      `SELECT * FROM ${TABLE} ORDER BY snapshot_time_utc DESC LIMIT 1`
    );

    if (!data.rows.length) {
      $("kpis").innerHTML = "";
      $("latest-fresh").hidden = true;
      UI.setStatus(status, "empty", "No snapshot yet.");
      return;
    }

    renderKpis(data.rows[0]);
    UI.setStatus(status, "", "");
  });

  loadList("assets", ASSETS_SQL, "No assets in the latest snapshot (or Tronscan was unavailable).");
}


/* ======================================================
   HISTORY: Load / Run / CSV (same flow as sr.html)
   ====================================================== */

const HISTORY = {
  columns: [
    "id",
    "snapshot_time_hkt",
    "trx_available",
    "trx_staked",
    "trx_unstaking",
    "trx_total",
    "claimable_reward_trx",
    "strx_balance",
    "votes_used",
    "energy_available",
    "bandwidth_available",
    "trx_price_usd",
    "total_assets_usd"
  ],
  timeColumn: "snapshot_time_hkt",
  limit: 48
};

const selectList = HISTORY.columns.map(c => "  " + c).join(",\n");

function defaultSql() {
  return `SELECT\n${selectList}\nFROM ${TABLE}\nORDER BY id DESC\nLIMIT ${HISTORY.limit}\n`;
}

function filteredSql(from, to) {
  let sql = `SELECT\n${selectList}\nFROM ${TABLE}\nWHERE 1=1\n`;
  if (from) sql += `AND ${HISTORY.timeColumn} >= '${from} 00:00:00'\n`;
  if (to) sql += `AND ${HISTORY.timeColumn} <= '${to} 23:59:59'\n`;
  return sql + `ORDER BY id DESC\nLIMIT ${HISTORY.limit}\n`;
}

// SQL the page itself last put in the box; Load asks before replacing anything else.
let lastSql = "";

function panel() {
  return {
    sql: $("history-sql").value,
    container: $("history-result"),
    status: $("history-status"),
    buttons: document.querySelectorAll("#history-tab button")
  };
}

function runHistory() {
  return UI.runSqlInto(panel());
}

function loadHistory() {
  const from = $("history-from").value;
  const to = $("history-to").value;
  const box = $("history-sql");

  if (from && to && from > to) {
    UI.setStatus($("history-status"), "error", "The From date is later than the To date.");
    return;
  }

  if (
    box.value !== lastSql &&
    !confirm("Load will replace the SQL you edited under Custom SQL. Continue?")
  ) {
    return;
  }

  box.value = lastSql = filteredSql(from, to);
  runHistory();
}


/* ======================================================
   INITIAL LOAD
   ====================================================== */

$("history-sql").value = lastSql = defaultSql();

loadLatest().then(runHistory);

</script>

</body>
</html>
