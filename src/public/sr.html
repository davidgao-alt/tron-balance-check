<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Metrics · TRON Dashboards</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/common.css">
<script src="assets/common.js"></script>
<script defer src="assets/sql-schema.js"></script>
</head>
<body>
<main class="page">

  <header class="page-header">
    <div>
      <h1 class="page-title" id="page-title">SR Metrics</h1>
      <p class="page-sub" id="page-sub"></p>
    </div>
  </header>

  <!-- One panel per dataset; the URL hash picks it (sr.html, sr.html#he). -->
  <div id="sr-tab">
    <section class="card">
      <div class="card-head"><h2 class="card-title">Snapshot history</h2></div>
      <div class="toolbar">
        <label class="field">From (HKT) <input type="date" id="sr-from"></label>
        <label class="field">To (HKT) <input type="date" id="sr-to"></label>
        <button type="button" class="primary" data-action="load">Load</button>
        <span class="spacer"></span>
        <button type="button" data-action="csv">Download CSV</button>
      </div>
      <details class="collapsible" data-remember="sr-sql" style="margin-top: 14px;">
        <summary>Custom SQL</summary>
        <textarea id="sr-sql" aria-label="Custom SQL" spellcheck="false" data-schema-tables="sr_snapshots"></textarea>
        <button type="button" class="primary" data-action="run">Run</button>
      </details>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Query results</h2>
        <div id="sr-status"></div>
      </div>
      <div class="table-wrap" id="sr-result"></div>
    </section>
  </div>

  <div id="he-tab" hidden>
    <section class="card">
      <div class="card-head"><h2 class="card-title">Snapshot history</h2></div>
      <div class="toolbar">
        <label class="field">From (UTC) <input type="date" id="he-from"></label>
        <label class="field">To (UTC) <input type="date" id="he-to"></label>
        <button type="button" class="primary" data-action="load">Load</button>
        <span class="spacer"></span>
        <button type="button" data-action="csv">Download CSV</button>
      </div>
      <details class="collapsible" data-remember="he-sql" style="margin-top: 14px;">
        <summary>Custom SQL</summary>
        <textarea id="he-sql" aria-label="Custom SQL" spellcheck="false" data-schema-tables="he_vote_snapshots"></textarea>
        <button type="button" class="primary" data-action="run">Run</button>
      </details>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Query results</h2>
        <div id="he-status"></div>
      </div>
      <div class="table-wrap" id="he-result"></div>
    </section>
  </div>

</main>

<script>
/* ======================================================
   DATASETS (one config per panel; SQL text is built from it)
   ====================================================== */

const TABS = {
  sr: {
    title: "SR Metrics",
    sub: "Votes, vote share, brokerage and claimable rewards by Super Representative. Snapshots every two hours.",
    table: "sr_snapshots",
    predicate: "(account_status IS NULL OR account_status = 'SR')",
    columns: [
      "id",
      "timestamputc",
      "timestamphkt",
      "name",
      "realtimevotes",
      "brokerage",
      "voterbrokerage",
      "annualizedrate",
      "votespercentage",
      "claimable_trx"
    ],
    timeColumn: "timestamphkt",
    limit: 28
  },
  he: {
    title: "HE Vote Snapshot",
    sub: "HE votes per candidate and their share of each candidate's total votes.",
    table: "he_vote_snapshots",
    columns: [
      "id",
      "snapshot_time_utc",
      "candidate_name",
      "candidate_ranking",
      "he_votes",
      "candidate_total_votes",
      "pct"
    ],
    timeColumn: "snapshot_time_utc",
    limit: 26
  }
};

const el = (tab, name) => document.getElementById(`${tab}-${name}`);

const selectList = (cfg) => cfg.columns.map(c => "  " + c).join(",\n");

// SQL in the Custom SQL box when the page opens.
function defaultSql(cfg) {
  return `SELECT\n${selectList(cfg)}\nFROM ${cfg.table}${cfg.predicate ? "\nWHERE " + cfg.predicate : ""}\nORDER BY id DESC\nLIMIT ${cfg.limit}\n`;
}

// SQL written by Load for the chosen dates.
function filteredSql(cfg, from, to) {
  let sql = `SELECT\n${selectList(cfg)}\nFROM ${cfg.table}\nWHERE ${cfg.predicate || "1=1"}\n`;
  if (from) sql += `  AND ${cfg.timeColumn} >= '${from} 00:00:00'\n`;
  if (to) sql += `  AND ${cfg.timeColumn} <= '${to} 23:59:59'\n`;
  return sql + `ORDER BY id DESC\nLIMIT ${cfg.limit}\n`;
}

/* ======================================================
   RUN / CSV / LOAD
   (request, status and table helpers: assets/common.js)
   ====================================================== */

// SQL the page itself last put in each box; Load asks before replacing anything else.
const lastSql = {};

// Panels whose data has been queried at least once.
const loaded = {};

function panel(tab) {
  return {
    sql: el(tab, "sql").value,
    container: el(tab, "result"),
    status: el(tab, "status"),
    buttons: el(tab, "tab").querySelectorAll("button")
  };
}

function runTab(tab) {
  loaded[tab] = true;
  return UI.runSqlInto(panel(tab));
}

function downloadTab(tab) {
  return UI.downloadCsv(panel(tab));
}

function loadTab(tab) {
  const from = el(tab, "from").value;
  const to = el(tab, "to").value;
  const box = el(tab, "sql");

  if (from && to && from > to) {
    UI.setStatus(el(tab, "status"), "error", "The From date is later than the To date.");
    return;
  }

  if (box.value !== lastSql[tab] && !confirm("Load will replace the SQL you edited under Custom SQL. Continue?")) {
    return;
  }

  box.value = lastSql[tab] = filteredSql(TABS[tab], from, to);
  runTab(tab);
}

const ACTIONS = { load: loadTab, run: runTab, csv: downloadTab };

for (const tab of Object.keys(TABS)) {
  el(tab, "sql").value = lastSql[tab] = defaultSql(TABS[tab]);
  el(tab, "tab").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (button) ACTIONS[button.dataset.action](tab);
  });
}

/* ======================================================
   PANEL SWITCH (site navigation links to sr.html and sr.html#he)
   ====================================================== */

function showTab() {
  const tab = location.hash === "#he" ? "he" : "sr";
  for (const name of Object.keys(TABS)) el(name, "tab").hidden = name !== tab;

  document.getElementById("page-title").textContent = TABS[tab].title;
  document.getElementById("page-sub").textContent = TABS[tab].sub;
  document.title = `${TABS[tab].title} · TRON Dashboards`;

  // A panel is only queried once it is opened.
  if (!loaded[tab]) runTab(tab);
}

window.addEventListener("hashchange", showTab);
showTab();
</script>
</body>
</html>
