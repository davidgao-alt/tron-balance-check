<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TRONScan SR/SRP Metrics</title>

<style>
body {
  font-family: -apple-system;
  background: #f8fafc;
  color: #0f172a;
  padding: 40px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  text-align: center;
  margin-bottom: 30px;
}

.box {
  background: white;
  border: 1px solid #e2e8f0;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}

input, textarea {
  padding: 6px;
  border: 1px solid #cbd5e1;
  margin-right: 10px;
}

textarea {
  width: 100%;
  height: 70px;
  font-family: monospace;
}

button {
  padding: 6px 14px;
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
  margin-right: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 13px;
}
</style>
</head>

<body>

<h2>TRONScan SR Metrics</h2>

<!-- 日期筛选（HKT） -->
<div class="box">
  <b>Filter (HKT)</b><br><br>

  From:
  <input type="date" id="fromDate">

  To:
  <input type="date" id="toDate">

  <button onclick="loadByDate()">Load</button>
</div>

<!-- SQL -->
<div class="box">
  <b>Custom SQL</b><br><br>

  <textarea id="sqlBox">
SELECT id, timestamputc, timestamphkt, address, name,
realtimevotes, brokerage, annualizedrate, votespercentage, claimable_trx
FROM sr_snapshots
ORDER BY id DESC
LIMIT 20
  </textarea>

  <br>

  <button onclick="runSQL()">Run</button>
  <button onclick="downloadCSV()">Download CSV</button>
</div>

<!-- 表格 -->
<div id="table"></div>

<script>

let currentSQL = "";

// 默认加载
window.onload = () => {
  runSQL();
};

async function runSQL() {
  const sql = document.getElementById("sqlBox").value;
  currentSQL = sql;

  const res = await fetch("/api/sql", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ sql })
  });

  const result = await res.json();

  if (result.error) {
    alert(result.error);
    return;
  }

  render(result.rows, result.fields);
}

async function loadByDate() {
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  if (!from || !to) {
    alert("Please select date range");
    return;
  }

  // 自动补 HKT 时间
  const fromTS = from + " 00:00:00";
  const toTS = to + " 23:59:59";

  const sql = `
SELECT id, timestamputc, timestamphkt, address, name,
realtimevotes, brokerage, annualizedrate, votespercentage, claimable_trx
FROM sr_snapshots
WHERE timestamphkt BETWEEN '${fromTS}' AND '${toTS}'
ORDER BY id DESC
LIMIT 50
  `;

  document.getElementById("sqlBox").value = sql;
  currentSQL = sql;

  runSQL();
}

function render(rows, fields) {
  const container = document.getElementById("table");

  if (!rows.length) {
    container.innerHTML = "<p>No data</p>";
    return;
  }

  let html = "<table><tr>";

  fields.forEach(f => {
    html += `<th>${f}</th>`;
  });

  html += "</tr>";

  rows.forEach(r => {
    html += "<tr>";

    fields.forEach(f => {
      html += `<td>${r[f] ?? ""}</td>`;
    });

    html += "</tr>";
  });

  html += "</table>";

  container.innerHTML = html;
}

function downloadCSV() {
  if (!currentSQL) {
    alert("Run query first");
    return;
  }

  window.location = "/api/sql-csv?sql=" + encodeURIComponent(currentSQL);
}

</script>

</body>
</html>
