<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TRON SR Dashboard</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/common.css">
<script src="assets/common.js"></script>
</head>


<body>

<div class="page">

<header class="page-header">

  <h1 class="page-title">TRON SR Dashboard</h1>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('sr')">SR Metrics</div>
    <div class="tab" onclick="switchTab('he')">HE Vote Snapshot</div>
  </div>

</header>


<!-- =====================================================
     SR TAB
     ===================================================== -->

<div id="sr-tab">

<section class="card">

<div class="toolbar">
  <label class="field">From (HKT) <input type="date" id="sr-from"></label>
  <label class="field">To (HKT) <input type="date" id="sr-to"></label>
  <button class="primary" onclick="loadSR()">Load</button>
  <span class="spacer"></span>
  <button onclick="downloadSR()">Download CSV</button>
</div>

<details class="collapsible" data-remember="sr-sql" style="margin-top: 14px;">
<summary>Custom SQL</summary>

<textarea id="sr-sql">
SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
ORDER BY id DESC
LIMIT 28
</textarea>

<button class="primary" onclick="runSR()">Run</button>

</details>

</section>


<section class="card">

<div id="sr-status"></div>

<div class="table-wrap" id="sr-result"></div>

</section>

</div>


<!-- =====================================================
     HE TAB
     ===================================================== -->

<div id="he-tab" class="hidden">

<section class="card">

<div class="toolbar">
  <label class="field">From (UTC) <input type="date" id="he-from"></label>
  <label class="field">To (UTC) <input type="date" id="he-to"></label>
  <button class="primary" onclick="loadHE()">Load</button>
  <span class="spacer"></span>
  <button onclick="downloadHE()">Download CSV</button>
</div>

<details class="collapsible" data-remember="he-sql" style="margin-top: 14px;">
<summary>Custom SQL</summary>

<textarea id="he-sql">
SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
ORDER BY id DESC
LIMIT 26
</textarea>

<button class="primary" onclick="runHE()">Run</button>

</details>

</section>


<section class="card">

<div id="he-status"></div>

<div class="table-wrap" id="he-result"></div>

</section>

</div>

</div>

<script>

/* ======================================================
   TAB SWITCH
   ====================================================== */

function switchTab(tab) {

  document
    .getElementById("sr-tab")
    .classList.add("hidden");

  document
    .getElementById("he-tab")
    .classList.add("hidden");


  document
    .querySelectorAll(".tab")
    .forEach(
      t =>
        t.classList.remove(
          "active"
        )
    );


  if (tab === "sr") {

    document
      .getElementById("sr-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[0]
      .classList.add("active");

  } else {

    document
      .getElementById("he-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[1]
      .classList.add("active");

  }

}


/* ======================================================
   RUN SQL / CSV DOWNLOAD
   (request, status and table helpers: assets/common.js)
   ====================================================== */

function panel(tab) {

  return {
    sql: document.getElementById(`${tab}-sql`).value,
    container: document.getElementById(`${tab}-result`),
    status: document.getElementById(`${tab}-status`),
    buttons: document.querySelectorAll(`#${tab}-tab button`)
  };

}


function runSR() {
  return UI.runSqlInto(panel("sr"));
}


function runHE() {
  return UI.runSqlInto(panel("he"));
}


function downloadSR() {
  return UI.downloadCsv(panel("sr"));
}


function downloadHE() {
  return UI.downloadCsv(panel("he"));
}


/* ======================================================
   SR DATE FILTER
   ====================================================== */

function loadSR() {

  const from =
    document
      .getElementById(
        "sr-from"
      )
      .value;


  const to =
    document
      .getElementById(
        "sr-to"
      )
      .value;


  let sql = `

SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
WHERE 1=1

`;


  if (from) {

    sql += `

AND timestamphkt >=
'${from} 00:00:00'

`;

  }


  if (to) {

    sql += `

AND timestamphkt <=
'${to} 23:59:59'

`;

  }


  sql += `

ORDER BY id DESC
LIMIT 28

`;


  document
    .getElementById(
      "sr-sql"
    )
    .value =
      sql;


  runSR();

}


/* ======================================================
   HE DATE FILTER
   ====================================================== */

function loadHE() {

  const from =
    document
      .getElementById(
        "he-from"
      )
      .value;


  const to =
    document
      .getElementById(
        "he-to"
      )
      .value;


  let sql = `

SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
WHERE 1=1

`;


  if (from) {

    sql += `

AND snapshot_time_utc >=
'${from} 00:00:00'

`;

  }


  if (to) {

    sql += `

AND snapshot_time_utc <=
'${to} 23:59:59'

`;

  }


  sql += `

ORDER BY id DESC
LIMIT 26

`;


  document
    .getElementById(
      "he-sql"
    )
    .value =
      sql;


  runHE();

}


/* ======================================================
   INITIAL LOAD
   ====================================================== */

runSR();
runHE();

</script>

</body>
</html>
