<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TRONScan SR / SRP Metrics</title>

<style>
body {
  font-family: -apple-system;
  background: #f6f8fb;
  padding: 30px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 8px;
}

input {
  padding: 6px;
  margin-right: 10px;
}

button {
  padding: 6px 12px;
  background: #3b6ef5;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

textarea {
  width: 100%;
  height: 110px;
  font-family: monospace;
  padding: 10px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  font-size: 13px;
  min-width: 900px;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
}

th {
  background: #fafafa;
}
</style>
</head>

<body>

<div class="container">

<h1>TRONScan SR / SRP Metrics</h1>

<!-- ✅ FILTER 保留 -->
<div class="card">
<h3>Filter (HKT)</h3>

From:
<input type="date" id="from">

To:
<input type="date" id="to">

<button onclick="load()">Load</button>
</div>

<div class="card">
<h3>Custom SQL</h3>

<textarea id="sql">
SELECT id, timestamputc, timestamphkt, address, name,
realtimevotes, brokerage, annualizedrate, votespercentage, claimable_trx
FROM sr_snapshots
ORDER BY id DESC
LIMIT 20
</textarea>

<button onclick="run()">Run</button>
<button onclick="download()">Download CSV</button>
</div>

<div class="card">
<div class="table-wrap">
<table id="table"></table>
</div>
</div>

</div>

<script>

function formatField(name) {
  const map = {
    timestamputc: "timestampUTC",
    timestamphkt: "timestampHKT",
    realtimevotes: "realTimeVotes",
    brokerage: "brokerage",
    annualizedrate: "annualizedRate",
    votespercentage: "votesPercentage",
    claimable_trx: "claimableTrx",
    address: "address",
    name: "name",
    id: "id"
  };

  return map[name] || name;
}

async function run() {
  const sql = document.getElementById("sql").value;

  const res = await fetch("/api/sql", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ sql })
  });

  const data = await res.json();
  render(data);
}

function render(data) {
  const table = document.getElementById("table");

  let html = "<tr>";

  data.fields.forEach(f => {
    html += `<th>${formatField(f)}</th>`;
  });

  html += "</tr>";

  data.rows.forEach(r => {
    html += "<tr>";
    data.fields.forEach(f => {
      html += `<td>${r[f] ?? ""}</td>`;
    });
    html += "</tr>";
  });

  table.innerHTML = html;
}

function download() {
  const sql = encodeURIComponent(document.getElementById("sql").value);
  window.location = "/api/sql-csv?sql=" + sql;
}

function load() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;

  let sql = `
SELECT id, timestamputc, timestamphkt, address, name,
realtimevotes, brokerage, annualizedrate, votespercentage, claimable_trx
FROM sr_snapshots
WHERE 1=1
`;

  if (from) {
    sql += ` AND timestamphkt >= '${from} 00:00:00'`;
  }

  if (to) {
    sql += ` AND timestamphkt <= '${to} 23:59:59'`;
  }

  sql += " ORDER BY id DESC LIMIT 20";

  document.getElementById("sql").value = sql;

  run();
}

// 初始加载
run();

</script>

</body>
</html>
