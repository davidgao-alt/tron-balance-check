<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TRON SR Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 40px;
  color: #111827;
}

.container {
  max-width: 1500px;
  margin: auto;
}

.main-title {
  text-align: center;
  font-size: 54px;
  font-weight: 800;
  margin-bottom: 45px;
  color: #0f172a;
  letter-spacing: -1px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 40px;
}

.tab {
  padding: 14px 28px;
  border-radius: 12px;
  background: #dbe2ea;
  cursor: pointer;
  font-weight: 700;
  font-size: 17px;
  transition: all 0.2s ease;
  user-select: none;
}

.tab:hover {
  transform: translateY(-1px);
}

.tab.active {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
}

.section-title {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 30px;
  color: #111827;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 30px;
  margin-bottom: 28px;
  box-shadow:
    0 4px 14px rgba(15, 23, 42, 0.05),
    0 1px 3px rgba(15, 23, 42, 0.08);
}

.filter-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

label {
  font-weight: 700;
  font-size: 15px;
}

input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #f8fafc;
  font-size: 14px;
}

.sql-title {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 24px;
}

textarea {
  width: 100%;
  min-height: 180px;
  border-radius: 14px;
  border: 1px solid #dbe2ea;
  padding: 18px;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.5;
  background: #f8fafc;
  resize: vertical;
  margin-bottom: 22px;
}

.button-row {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

button {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 11px 22px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: 0.18s ease;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.96;
}

.table-wrap {
  overflow-x: auto;
  border-radius: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: white;
}

th {
  background: #f1f5f9;
  text-align: left;
  padding: 14px 12px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 13px;
  font-weight: 800;
  color: #334155;
  position: sticky;
  top: 0;
}

td {
  padding: 13px 12px;
  border-bottom: 1px solid #f1f5f9;
  white-space: nowrap;
}

tr:hover td {
  background: #f8fbff;
}

.hidden {
  display: none;
}

</style>
</head>

<body>

<div class="container">

<div class="main-title">
TRON SR Dashboard
</div>

<div class="tabs">

  <div class="tab active" onclick="switchTab('sr')">
    SR Metrics
  </div>

  <div class="tab" onclick="switchTab('he')">
    HE Vote Snapshot
  </div>

</div>

<!-- ===================================================== -->
<!-- SR TAB -->
<!-- ===================================================== -->

<div id="sr-tab">

<div class="section-title">
SR Metrics
</div>

<div class="card">

<div class="filter-row">

<label>From (HKT)</label>
<input type="date" id="sr-from">

<label>To (HKT)</label>
<input type="date" id="sr-to">

<button onclick="loadSR()">
Load
</button>

</div>

</div>

<div class="card">

<div class="sql-title">
Custom SQL
</div>

<textarea id="sr-sql">
SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
ORDER BY id DESC
LIMIT 28
</textarea>

<div class="button-row">

<button onclick="runSR()">
Run
</button>

<button onclick="downloadSR()">
Download CSV
</button>

</div>

</div>

<div class="card">
<div class="table-wrap">
<table id="sr-table"></table>
</div>
</div>

</div>

<!-- ===================================================== -->
<!-- HE TAB -->
<!-- ===================================================== -->

<div id="he-tab" class="hidden">

<div class="section-title">
HE Vote Snapshot
</div>

<div class="card">

<div class="filter-row">

<label>From (UTC)</label>
<input type="date" id="he-from">

<label>To (UTC)</label>
<input type="date" id="he-to">

<button onclick="loadHE()">
Load
</button>

</div>

</div>

<div class="card">

<div class="sql-title">
Custom SQL
</div>

<textarea id="he-sql">
SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
ORDER BY id DESC
LIMIT 26
</textarea>

<div class="button-row">

<button onclick="runHE()">
Run
</button>

<button onclick="downloadHE()">
Download CSV
</button>

</div>

</div>

<div class="card">
<div class="table-wrap">
<table id="he-table"></table>
</div>
</div>

</div>

</div>

<script>

function switchTab(tab) {

  document
    .getElementById("sr-tab")
    .classList.add("hidden");

  document
    .getElementById("he-tab")
    .classList.add("hidden");

  document
    .querySelectorAll(".tab")
    .forEach(t => t.classList.remove("active"));

  if (tab === "sr") {

    document
      .getElementById("sr-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[0]
      .classList.add("active");

  } else {

    document
      .getElementById("he-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[1]
      .classList.add("active");
  }
}

async function query(sql) {

  const res = await fetch("/api/sql", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ sql })
  });

  return await res.json();
}

function render(tableId, data) {

  const table =
    document.getElementById(tableId);

  let html = "<tr>";

  data.fields.forEach(f => {
    html += `<th>${f}</th>`;
  });

  html += "</tr>";

  data.rows.forEach(r => {

    html += "<tr>";

    data.fields.forEach(f => {

      html += `<td>${r[f] ?? ""}</td>`;

    });

    html += "</tr>";
  });

  table.innerHTML = html;
}

async function runSR() {

  const sql =
    document.getElementById("sr-sql").value;

  const data =
    await query(sql);

  render("sr-table", data);
}

async function runHE() {

  const sql =
    document.getElementById("he-sql").value;

  const data =
    await query(sql);

  render("he-table", data);
}

function downloadSR() {

  const sql = encodeURIComponent(
    document.getElementById("sr-sql").value
  );

  window.location =
    "/api/sql-csv?sql=" + sql;
}

function downloadHE() {

  const sql = encodeURIComponent(
    document.getElementById("he-sql").value
  );

  window.location =
    "/api/sql-csv?sql=" + sql;
}

function loadSR() {

  const from =
    document.getElementById("sr-from").value;

  const to =
    document.getElementById("sr-to").value;

  let sql = `
SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
WHERE 1=1
`;

  if (from) {
    sql += `
AND timestamphkt >= '${from} 00:00:00'
`;
  }

  if (to) {
    sql += `
AND timestamphkt <= '${to} 23:59:59'
`;
  }

  sql += `
ORDER BY id DESC
LIMIT 28
`;

  document.getElementById("sr-sql").value = sql;

  runSR();
}

function loadHE() {

  const from =
    document.getElementById("he-from").value;

  const to =
    document.getElementById("he-to").value;

  let sql = `
SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
WHERE 1=1
`;

  if (from) {
    sql += `
AND snapshot_time_utc >= '${from} 00:00:00'
`;
  }

  if (to) {
    sql += `
AND snapshot_time_utc <= '${to} 23:59:59'
`;
  }

  sql += `
ORDER BY id DESC
LIMIT 26
`;

  document.getElementById("he-sql").value = sql;

  runHE();
}

runSR();
runHE();

</script>

</body>
</html>
