<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">

<title>TRON SR Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 40px;
  color: #111827;
}

.container {
  max-width: 1500px;
  margin: auto;
}

.main-title {
  text-align: center;
  font-size: 54px;
  font-weight: 800;
  margin-bottom: 45px;
  color: #0f172a;
  letter-spacing: -1px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 40px;
}

.tab {
  padding: 14px 28px;
  border-radius: 12px;
  background: #dbe2ea;
  cursor: pointer;
  font-weight: 700;
  font-size: 17px;
  transition: all 0.2s ease;
  user-select: none;
}

.tab:hover {
  transform: translateY(-1px);
}

.tab.active {
  background: linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color: white;

  box-shadow:
    0 8px 20px
    rgba(37, 99, 235, 0.22);
}

.section-title {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 30px;
  color: #111827;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 30px;
  margin-bottom: 28px;

  box-shadow:
    0 4px 14px rgba(15, 23, 42, 0.05),
    0 1px 3px rgba(15, 23, 42, 0.08);
}

.filter-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

label {
  font-weight: 700;
  font-size: 15px;
}

input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  background: #f8fafc;
  font-size: 14px;
}

.sql-title {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 24px;
}

textarea {
  width: 100%;
  min-height: 180px;

  border-radius: 14px;
  border: 1px solid #dbe2ea;

  padding: 18px;

  font-family: monospace;
  font-size: 14px;
  line-height: 1.5;

  background: #f8fafc;

  resize: vertical;

  margin-bottom: 22px;
}

.button-row {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

button {
  background: linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color: white;

  border: none;
  border-radius: 10px;

  padding: 11px 22px;

  cursor: pointer;

  font-weight: 700;
  font-size: 14px;

  transition: 0.18s ease;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.96;
}


/* ======================================================
   NORMAL HORIZONTAL TABLE
   ====================================================== */

.table-wrap {
  overflow-x: auto;
  border-radius: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: white;
}

th {
  background: #f1f5f9;

  text-align: left;

  padding: 14px 12px;

  border-bottom:
    1px solid #e2e8f0;

  font-size: 13px;
  font-weight: 800;

  color: #334155;

  position: sticky;
  top: 0;
}

td {
  padding: 13px 12px;

  border-bottom:
    1px solid #f1f5f9;

  white-space: nowrap;
}

tr:hover td {
  background: #f8fbff;
}


/* ======================================================
   SINGLE RECORD VERTICAL TABLE
   ====================================================== */

.table-wrap.vertical-mode {
  max-width: 900px;
  margin: 0 auto;
  overflow-x: visible;

  border:
    1px solid #e2e8f0;

  border-radius: 14px;
}

.table-wrap.vertical-mode table {
  width: 100%;
  table-layout: fixed;
}

.table-wrap.vertical-mode th {
  position: static;
}

.vertical-header {
  background: #e9eff7 !important;
  color: #0f172a !important;
  font-size: 14px !important;
  padding: 15px 18px !important;
}

.metric-name {
  width: 42%;

  background:
    #f1f5f9 !important;

  color:
    #334155 !important;

  font-weight: 800;

  padding:
    14px 18px !important;

  border-bottom:
    1px solid #e2e8f0;

  vertical-align: top;
}

.metric-value {
  width: 58%;

  padding:
    14px 18px !important;

  border-bottom:
    1px solid #e2e8f0;

  white-space: normal !important;

  word-break: break-word;

  font-family: monospace;

  color: #111827;
}

.table-wrap.vertical-mode
tr:last-child
.metric-name,

.table-wrap.vertical-mode
tr:last-child
.metric-value {
  border-bottom: none;
}

.table-wrap.vertical-mode
tr:hover
.metric-value {
  background: #f8fbff;
}

.hidden {
  display: none;
}

</style>
</head>


<body>

<div class="container">

<div class="main-title">
  TRON SR Dashboard
</div>


<div class="tabs">

  <div
    class="tab active"
    onclick="switchTab('sr')"
  >
    SR Metrics
  </div>

  <div
    class="tab"
    onclick="switchTab('he')"
  >
    HE Vote Snapshot
  </div>

</div>


<!-- =====================================================
     SR TAB
     ===================================================== -->

<div id="sr-tab">

<div class="section-title">
  SR Metrics
</div>


<div class="card">

<div class="filter-row">

<label>
  From (HKT)
</label>

<input
  type="date"
  id="sr-from"
>

<label>
  To (HKT)
</label>

<input
  type="date"
  id="sr-to"
>

<button onclick="loadSR()">
  Load
</button>

</div>

</div>


<div class="card">

<div class="sql-title">
  Custom SQL
</div>

<textarea id="sr-sql">
SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
ORDER BY id DESC
LIMIT 28
</textarea>


<div class="button-row">

<button onclick="runSR()">
  Run
</button>

<button onclick="downloadSR()">
  Download CSV
</button>

</div>

</div>


<div class="card">

<div class="table-wrap">

<table id="sr-table"></table>

</div>

</div>

</div>


<!-- =====================================================
     HE TAB
     ===================================================== -->

<div
  id="he-tab"
  class="hidden"
>

<div class="section-title">
  HE Vote Snapshot
</div>


<div class="card">

<div class="filter-row">

<label>
  From (UTC)
</label>

<input
  type="date"
  id="he-from"
>

<label>
  To (UTC)
</label>

<input
  type="date"
  id="he-to"
>

<button onclick="loadHE()">
  Load
</button>

</div>

</div>


<div class="card">

<div class="sql-title">
  Custom SQL
</div>


<textarea id="he-sql">
SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
ORDER BY id DESC
LIMIT 26
</textarea>


<div class="button-row">

<button onclick="runHE()">
  Run
</button>

<button onclick="downloadHE()">
  Download CSV
</button>

</div>

</div>


<div class="card">

<div class="table-wrap">

<table id="he-table"></table>

</div>

</div>

</div>

</div>


<script>

/* ======================================================
   TAB SWITCH
   ====================================================== */

function switchTab(tab) {

  document
    .getElementById("sr-tab")
    .classList.add("hidden");

  document
    .getElementById("he-tab")
    .classList.add("hidden");


  document
    .querySelectorAll(".tab")
    .forEach(
      t =>
        t.classList.remove(
          "active"
        )
    );


  if (tab === "sr") {

    document
      .getElementById("sr-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[0]
      .classList.add("active");

  } else {

    document
      .getElementById("he-tab")
      .classList.remove("hidden");

    document
      .querySelectorAll(".tab")[1]
      .classList.add("active");

  }

}


/* ======================================================
   SQL API
   ====================================================== */

async function query(sql) {

  const res =
    await fetch(
      "/api/sql",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            sql
          })
      }
    );


  return await res.json();

}


/* ======================================================
   ESCAPE HTML
   ====================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ======================================================
   RESULT RENDERER
   ====================================================== */

function render(
  tableId,
  data
) {

  const table =
    document.getElementById(
      tableId
    );

  const wrap =
    table.closest(
      ".table-wrap"
    );


  /* -----------------------------------------------
     Invalid API response / SQL error
     ----------------------------------------------- */

  if (
    !data ||
    !Array.isArray(data.fields) ||
    !Array.isArray(data.rows)
  ) {

    wrap
      .classList
      .remove(
        "vertical-mode"
      );


    table.innerHTML = `
      <tr>
        <td>
          ${escapeHtml(
            data?.error ||
            "Invalid response"
          )}
        </td>
      </tr>
    `;

    return;
  }


  /* -----------------------------------------------
     No results
     ----------------------------------------------- */

  if (
    data.rows.length === 0
  ) {

    wrap
      .classList
      .remove(
        "vertical-mode"
      );


    table.innerHTML = `
      <tr>
        <td>
          No records found
        </td>
      </tr>
    `;

    return;
  }


  /* ==================================================
     ONE RECORD
     → VERTICAL METRIC / VALUE TABLE
     ================================================== */

  if (
    data.rows.length === 1
  ) {

    wrap
      .classList
      .add(
        "vertical-mode"
      );


    const row =
      data.rows[0];


    let html = `

      <tr>

        <th class="vertical-header">
          Metric
        </th>

        <th class="vertical-header">
          Value
        </th>

      </tr>

    `;


    data.fields.forEach(
      field => {

        const value =
          row[field] ??
          "";


        html += `

          <tr>

            <th class="metric-name">
              ${escapeHtml(
                field
              )}
            </th>

            <td class="metric-value">
              ${escapeHtml(
                value
              )}
            </td>

          </tr>

        `;

      }
    );


    table.innerHTML =
      html;


    return;

  }


  /* ==================================================
     MULTIPLE RECORDS
     → NORMAL HORIZONTAL TABLE
     ================================================== */

  wrap
    .classList
    .remove(
      "vertical-mode"
    );


  let html =
    "<tr>";


  data.fields.forEach(
    field => {

      html += `
        <th>
          ${escapeHtml(
            field
          )}
        </th>
      `;

    }
  );


  html +=
    "</tr>";


  data.rows.forEach(
    row => {

      html +=
        "<tr>";


      data.fields.forEach(
        field => {

          html += `
            <td>
              ${escapeHtml(
                row[field] ??
                ""
              )}
            </td>
          `;

        }
      );


      html +=
        "</tr>";

    }
  );


  table.innerHTML =
    html;

}


/* ======================================================
   RUN SR SQL
   ====================================================== */

async function runSR() {

  const sql =
    document
      .getElementById(
        "sr-sql"
      )
      .value;


  const data =
    await query(sql);


  render(
    "sr-table",
    data
  );

}


/* ======================================================
   RUN HE SQL
   ====================================================== */

async function runHE() {

  const sql =
    document
      .getElementById(
        "he-sql"
      )
      .value;


  const data =
    await query(sql);


  render(
    "he-table",
    data
  );

}


/* ======================================================
   CSV DOWNLOAD
   ====================================================== */

function downloadSR() {

  const sql =
    encodeURIComponent(
      document
        .getElementById(
          "sr-sql"
        )
        .value
    );


  window.location =
    "/api/sql-csv?sql=" +
    sql;

}


function downloadHE() {

  const sql =
    encodeURIComponent(
      document
        .getElementById(
          "he-sql"
        )
        .value
    );


  window.location =
    "/api/sql-csv?sql=" +
    sql;

}


/* ======================================================
   SR DATE FILTER
   ====================================================== */

function loadSR() {

  const from =
    document
      .getElementById(
        "sr-from"
      )
      .value;


  const to =
    document
      .getElementById(
        "sr-to"
      )
      .value;


  let sql = `

SELECT
  id,
  timestamputc,
  timestamphkt,
  name,
  realtimevotes,
  brokerage,
  voterbrokerage,
  annualizedrate,
  votespercentage,
  claimable_trx
FROM sr_snapshots
WHERE 1=1

`;


  if (from) {

    sql += `

AND timestamphkt >=
'${from} 00:00:00'

`;

  }


  if (to) {

    sql += `

AND timestamphkt <=
'${to} 23:59:59'

`;

  }


  sql += `

ORDER BY id DESC
LIMIT 28

`;


  document
    .getElementById(
      "sr-sql"
    )
    .value =
      sql;


  runSR();

}


/* ======================================================
   HE DATE FILTER
   ====================================================== */

function loadHE() {

  const from =
    document
      .getElementById(
        "he-from"
      )
      .value;


  const to =
    document
      .getElementById(
        "he-to"
      )
      .value;


  let sql = `

SELECT
  id,
  snapshot_time_utc,
  candidate_name,
  candidate_ranking,
  he_votes,
  candidate_total_votes,
  pct
FROM he_vote_snapshots
WHERE 1=1

`;


  if (from) {

    sql += `

AND snapshot_time_utc >=
'${from} 00:00:00'

`;

  }


  if (to) {

    sql += `

AND snapshot_time_utc <=
'${to} 23:59:59'

`;

  }


  sql += `

ORDER BY id DESC
LIMIT 26

`;


  document
    .getElementById(
      "he-sql"
    )
    .value =
      sql;


  runHE();

}


/* ======================================================
   INITIAL LOAD
   ====================================================== */

runSR();
runHE();

</script>

</body>
</html>
