<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TRON SR Dashboard</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/common.css">
<script src="assets/common.js"></script>
</head>


<body>

<div class="page">

<header class="page-header">

  <h1 class="page-title">TRON SR Dashboard</h1>

  <div class="tabs" role="tablist">
    <button type="button" class="tab active" role="tab" data-tab="sr" aria-selected="true">SR Metrics</button>
    <button type="button" class="tab" role="tab" data-tab="he" aria-selected="false">HE Vote Snapshot</button>
  </div>

</header>


<!-- =====================================================
     SR TAB
     ===================================================== -->

<div id="sr-tab">

<section class="card">

<div class="toolbar">
  <label class="field">From (HKT) <input type="date" id="sr-from"></label>
  <label class="field">To (HKT) <input type="date" id="sr-to"></label>
  <button class="primary" onclick="loadTab('sr')">Load</button>
  <span class="spacer"></span>
  <button onclick="downloadTab('sr')">Download CSV</button>
</div>

<details class="collapsible" data-remember="sr-sql" style="margin-top: 14px;">
<summary>Custom SQL</summary>

<textarea id="sr-sql"></textarea>

<button class="primary" onclick="runTab('sr')">Run</button>

</details>

</section>


<section class="card">

<div id="sr-status"></div>

<div class="table-wrap" id="sr-result"></div>

</section>

</div>


<!-- =====================================================
     HE TAB
     ===================================================== -->

<div id="he-tab" class="hidden">

<section class="card">

<div class="toolbar">
  <label class="field">From (UTC) <input type="date" id="he-from"></label>
  <label class="field">To (UTC) <input type="date" id="he-to"></label>
  <button class="primary" onclick="loadTab('he')">Load</button>
  <span class="spacer"></span>
  <button onclick="downloadTab('he')">Download CSV</button>
</div>

<details class="collapsible" data-remember="he-sql" style="margin-top: 14px;">
<summary>Custom SQL</summary>

<textarea id="he-sql"></textarea>

<button class="primary" onclick="runTab('he')">Run</button>

</details>

</section>


<section class="card">

<div id="he-status"></div>

<div class="table-wrap" id="he-result"></div>

</section>

</div>

</div>

<script>

/* ======================================================
   TABLES (one config per tab; SQL text is built from it)
   ====================================================== */

const TABS = {
  sr: {
    table: "sr_snapshots",
    columns: [
      "id",
      "timestamputc",
      "timestamphkt",
      "name",
      "realtimevotes",
      "brokerage",
      "voterbrokerage",
      "annualizedrate",
      "votespercentage",
      "claimable_trx"
    ],
    timeColumn: "timestamphkt",
    limit: 28
  },
  he: {
    table: "he_vote_snapshots",
    columns: [
      "id",
      "snapshot_time_utc",
      "candidate_name",
      "candidate_ranking",
      "he_votes",
      "candidate_total_votes",
      "pct"
    ],
    timeColumn: "snapshot_time_utc",
    limit: 26
  }
};

const el = (tab, name) => document.getElementById(`${tab}-${name}`);

const selectList = (cfg) => cfg.columns.map(c => "  " + c).join(",\n");


// SQL in the Custom SQL box when the page opens.
function defaultSql(cfg) {
  return `SELECT\n${selectList(cfg)}\nFROM ${cfg.table}\nORDER BY id DESC\nLIMIT ${cfg.limit}\n`;
}


// SQL written by Load (same text, blank lines included, as before).
function filteredSql(cfg, from, to) {
  let sql = `\n\nSELECT\n${selectList(cfg)}\nFROM ${cfg.table}\nWHERE 1=1\n\n`;
  if (from) sql += `\n\nAND ${cfg.timeColumn} >=\n'${from} 00:00:00'\n\n`;
  if (to) sql += `\n\nAND ${cfg.timeColumn} <=\n'${to} 23:59:59'\n\n`;
  return sql + `\n\nORDER BY id DESC\nLIMIT ${cfg.limit}\n\n`;
}


/* ======================================================
   RUN / CSV / LOAD
   (request, status and table helpers: assets/common.js)
   ====================================================== */

// SQL the page itself last put in each box; Load asks before replacing anything else.
const lastSql = {};

// Tabs whose data has been queried at least once.
const loaded = {};


function panel(tab) {
  return {
    sql: el(tab, "sql").value,
    container: el(tab, "result"),
    status: el(tab, "status"),
    buttons: document.querySelectorAll(`#${tab}-tab button`)
  };
}


function runTab(tab) {
  loaded[tab] = true;
  return UI.runSqlInto(panel(tab));
}


function downloadTab(tab) {
  return UI.downloadCsv(panel(tab));
}


function loadTab(tab) {
  const from = el(tab, "from").value;
  const to = el(tab, "to").value;
  const box = el(tab, "sql");

  if (from && to && from > to) {
    UI.setStatus(el(tab, "status"), "error", "The From date is later than the To date.");
    return;
  }

  if (
    box.value !== lastSql[tab] &&
    !confirm("Load will replace the SQL you edited under Custom SQL. Continue?")
  ) {
    return;
  }

  box.value = lastSql[tab] = filteredSql(TABS[tab], from, to);
  runTab(tab);
}


/* ======================================================
   TAB SWITCH (current tab kept in the URL: sr.html#he)
   ====================================================== */

function switchTab(tab) {
  for (const name of Object.keys(TABS)) {
    const button = document.querySelector(`.tab[data-tab="${name}"]`);
    button.classList.toggle("active", name === tab);
    button.setAttribute("aria-selected", String(name === tab));
    el(name, "tab").classList.toggle("hidden", name !== tab);
  }

  history.replaceState(null, "", tab === "sr" ? location.pathname + location.search : "#" + tab);

  // HE is only queried once it is opened.
  if (!loaded[tab]) runTab(tab);
}

const tabFromUrl = () => (location.hash === "#he" ? "he" : "sr");


/* ======================================================
   INITIAL LOAD
   ====================================================== */

for (const tab of Object.keys(TABS)) {
  el(tab, "sql").value = lastSql[tab] = defaultSql(TABS[tab]);
}

document
  .querySelectorAll(".tab[data-tab]")
  .forEach(button => button.addEventListener("click", () => switchTab(button.dataset.tab)));

window.addEventListener("hashchange", () => switchTab(tabFromUrl()));

switchTab(tabFromUrl());

</script>

</body>
</html>
