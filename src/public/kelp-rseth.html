<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Kelp rsETH Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:40px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#eef2f7;
  color:#0f172a;
}

.container{
  max-width:1500px;
  margin:auto;
}

.title{
  font-size:42px;
  font-weight:800;
  text-align:center;
  margin-bottom:34px;
  letter-spacing:-1px;
}

.card{
  background:white;
  border-radius:20px;
  padding:28px;
  margin-bottom:28px;

  box-shadow:
    0 4px 14px rgba(15,23,42,0.05),
    0 1px 3px rgba(15,23,42,0.08);
}

.row{
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}

label{
  font-size:14px;
  font-weight:700;
}

input{
  padding:11px 14px;
  border-radius:12px;
  border:1px solid #dbe2ea;
  background:#f8fafc;
  font-size:14px;
}

textarea{
  width:100%;
  min-height:180px;
  border-radius:14px;
  border:1px solid #dbe2ea;
  background:#f8fafc;
  padding:18px;
  resize:vertical;
  font-family:monospace;
  font-size:14px;
  margin-bottom:22px;
}

.table-wrap{
  overflow-x:auto;
  border-radius:14px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th{
  background:#f1f5f9;
  padding:14px 12px;
  text-align:left;
  font-size:13px;
  font-weight:800;
  color:#334155;
  border-bottom:1px solid #e2e8f0;
}

td{
  padding:13px 12px;
  border-bottom:1px solid #f1f5f9;
  white-space:nowrap;
  font-size:13px;
}

tr:hover td{
  background:#f8fbff;
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:22px;
}

.button-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 22px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;

  background:linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color:white;

  transition:0.18s ease;
}

button:hover{
  transform:translateY(-1px);
}

</style>

</head>

<body>

<div class="container">

<!-- ====================================================== -->
<!-- TITLE -->
<!-- ====================================================== -->

<div class="title">
Kelp rsETH Dashboard
</div>

<!-- ====================================================== -->
<!-- DATE FILTER -->
<!-- ====================================================== -->

<div class="card">

<div class="section-title">
UTC Time Filter
</div>

<div class="row">

<label>
From UTC
</label>

<input
  type="date"
  id="from-date"
/>

<label>
To UTC
</label>

<input
  type="date"
  id="to-date"
/>

<button onclick="loadData()">
Load Data
</button>

</div>

</div>

<!-- ====================================================== -->
<!-- SQL -->
<!-- ====================================================== -->

<div class="card">

<div class="section-title">
Custom SQL
</div>

<textarea id="sql-box">
SELECT
  id,
  timestamp_hkt AS timestamp_utc,
  chain,
  total_supply,
  status
FROM kelp_rseth_supply_snapshots
ORDER BY id DESC
LIMIT 50
</textarea>

<div class="button-row">

<button onclick="runSQL()">
Run SQL
</button>

<button onclick="downloadCSV()">
Download CSV
</button>

</div>

</div>

<!-- ====================================================== -->
<!-- TABLE -->
<!-- ====================================================== -->

<div class="card">

<div class="section-title">
Query Result
</div>

<div class="table-wrap">
<table id="result-table"></table>
</div>

</div>

</div>

<script>

async function query(sql){

  const res = await fetch("/api/sql",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      sql
    })
  });

  return await res.json();
}

function renderTable(data){

  const table =
    document.getElementById(
      "result-table"
    );

  let html = "<tr>";

  data.fields.forEach(f=>{

    html += `<th>${f}</th>`;

  });

  html += "</tr>";

  data.rows.forEach(r=>{

    html += "<tr>";

    data.fields.forEach(f=>{

      html += `<td>${r[f] ?? ""}</td>`;

    });

    html += "</tr>";
  });

  table.innerHTML = html;
}

async function runSQL(){

  const sql =
    document.getElementById(
      "sql-box"
    ).value;

  const data =
    await query(sql);

  renderTable(data);
}

function downloadCSV(){

  const sql =
    encodeURIComponent(
      document.getElementById(
        "sql-box"
      ).value
    );

  window.location =
    "/api/sql-csv?sql=" + sql;
}

function loadData(){

  const from =
    document.getElementById(
      "from-date"
    ).value;

  const to =
    document.getElementById(
      "to-date"
    ).value;

  let sql = `
SELECT
  id,
  timestamp_hkt AS timestamp_utc,
  chain,
  total_supply,
  status
FROM kelp_rseth_supply_snapshots
WHERE 1=1
`;

  if(from){

    sql += `
AND timestamp_hkt >= '${from} 00:00:00'
`;
  }

  if(to){

    sql += `
AND timestamp_hkt <= '${to} 23:59:59'
`;
  }

  sql += `
ORDER BY id DESC
LIMIT 200
`;

  document.getElementById(
    "sql-box"
  ).value = sql;

  runSQL();
}

runSQL();

</script>

</body>
</html>
